        stroke-dasharray: 14 10;
        animation: flow 1.6s linear infinite;
      }
      .flow2 {
        stroke-dasharray: 6 12;
        animation: flow 2.4s linear infinite reverse;
      }
      @keyframes flow {
        to { stroke-dashoffset: -48; }
      }
      .blink {
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
