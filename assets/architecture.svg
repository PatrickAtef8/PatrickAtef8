<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-label="PAO Power of Three tri-system architecture: bare metal layer (ESP32 and STM32) connected over CAN bus and UART to embedded Linux (Raspberry Pi 3B+, Yocto), connected over vsomeip and Ethernet to Android Automotive (Raspberry Pi 5, AOSP 15)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0d2b45"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#12304a" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <clipPath id="r"><rect width="1000" height="490" rx="18"/></clipPath>
    <style>
      .title { font: 700 21px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .ctitle { font: 700 16px 'Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing: 1px; }
      .csub { font: 500 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #9db6cd; }
      .item { font: 500 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #e3eef9; }
      .foot { font: 500 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #6f8aa5; letter-spacing: 1px; }
      .lbl { font: 700 13px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
      .lbl2 { font: 600 12px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; fill: #a78bfa; }
      .h2 { font: 700 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #ffffff; letter-spacing: 2px; }
      .row { font: 500 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #c9dbec; }
      .rowb { font-weight: 700; fill: #ffffff; }
      .sec { font: 600 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #fcd9a6; letter-spacing: 0.5px; }
      .flow { stroke-dasharray: 10 7; animation: flow 1.3s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -34; } }
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1000" height="490" fill="url(#bg)"/>
    <rect width="1000" height="490" fill="url(#grid)"/>
    <text x="500.0" y="38" text-anchor="middle" class="title">PAO – Power of Three: Tri-System Architecture</text>
    
    <rect x="30" y="62" width="250" height="236" rx="14" fill="#0a1626" stroke="#4ade80" stroke-width="2"/>
    <text x="155.0" y="100" text-anchor="middle" class="ctitle" fill="#4ade80">BARE METAL LAYER</text>
    <text x="155.0" y="122" text-anchor="middle" class="csub">ESP32 + STM32</text>
    <line x1="54" y1="136" x2="256" y2="136" stroke="#17405f" stroke-width="1"/>
    <circle cx="60" cy="161" r="3" fill="#4ade80"/>
    <text x="72" y="166" class="item">Fingerprint Authentication</text>
    <circle cx="60" cy="189" r="3" fill="#4ade80"/>
    <text x="72" y="194" class="item">Sensor Data Collection</text>
    <circle cx="60" cy="217" r="3" fill="#4ade80"/>
    <text x="72" y="222" class="item">Real-time Input Processing</text>
    <circle cx="60" cy="245" r="3" fill="#4ade80"/>
    <text x="72" y="250" class="item">SHA Security</text>
    <text x="155.0" y="282" text-anchor="middle" class="foot">Hardware Foundation Layer</text>
    <rect x="375" y="62" width="250" height="236" rx="14" fill="#0a1626" stroke="#fb923c" stroke-width="2"/>
    <text x="500.0" y="100" text-anchor="middle" class="ctitle" fill="#fb923c">EMBEDDED LINUX</text>
    <text x="500.0" y="122" text-anchor="middle" class="csub">Raspberry Pi 3B+  |  Yocto + meta-pao</text>
    <line x1="399" y1="136" x2="601" y2="136" stroke="#17405f" stroke-width="1"/>
    <circle cx="405" cy="161" r="3" fill="#fb923c"/>
    <text x="417" y="166" class="item">Central Bridge Node</text>
    <circle cx="405" cy="189" r="3" fill="#fb923c"/>
    <text x="417" y="194" class="item">Qt6 Cluster UI</text>
    <circle cx="405" cy="217" r="3" fill="#fb923c"/>
    <text x="417" y="222" class="item">Data Processing Hub</text>
    <circle cx="405" cy="245" r="3" fill="#fb923c"/>
    <text x="417" y="250" class="item">vsomeip Communication</text>
    <text x="500.0" y="282" text-anchor="middle" class="foot">Integration &amp; Control Layer</text>
    <rect x="720" y="62" width="250" height="236" rx="14" fill="#0a1626" stroke="#a78bfa" stroke-width="2"/>
    <text x="845.0" y="100" text-anchor="middle" class="ctitle" fill="#a78bfa">ANDROID AUTOMOTIVE</text>
    <text x="845.0" y="122" text-anchor="middle" class="csub">Raspberry Pi 5  |  AOSP 15 + VHAL</text>
    <line x1="744" y1="136" x2="946" y2="136" stroke="#17405f" stroke-width="1"/>
    <circle cx="750" cy="161" r="3" fill="#a78bfa"/>
    <text x="762" y="166" class="item">User Interface Layer</text>
    <circle cx="750" cy="189" r="3" fill="#a78bfa"/>
    <text x="762" y="194" class="item">HVAC &amp; Media Control</text>
    <circle cx="750" cy="217" r="3" fill="#a78bfa"/>
    <text x="762" y="222" class="item">Voice Assistant &amp; GPS</text>
    <circle cx="750" cy="245" r="3" fill="#a78bfa"/>
    <text x="762" y="250" class="item">OTA Updates &amp; Child Mode</text>
    <text x="845.0" y="282" text-anchor="middle" class="foot">Application &amp; Service Layer</text>

    <!-- Bare metal -> Linux -->
    <text x="327" y="152" text-anchor="middle" class="lbl" fill="#4ade80">CAN Bus</text>
    <path d="M284,162 L368,162" stroke="#4ade80" stroke-width="3" fill="none" class="flow" marker-end="url(#aG)"/>
    <text x="327" y="206" text-anchor="middle" class="lbl" fill="#fb923c">UART</text>
    <path d="M284,216 L368,216" stroke="#fb923c" stroke-width="3" fill="none" class="flow" marker-end="url(#aO)"/>

    <!-- Linux <-> Android -->
    <text x="672" y="152" text-anchor="middle" class="lbl" fill="#a78bfa">vsomeip</text>
    <path d="M629,162 L713,162" stroke="#a78bfa" stroke-width="3" fill="none" class="flow" marker-end="url(#aP)"/>
    <path d="M713,216 L629,216" stroke="#a78bfa" stroke-width="2" fill="none" class="flow" marker-end="url(#aP)"/>
    <text x="672" y="238" text-anchor="middle" class="lbl2">Bidirectional</text>

    <!-- communication -->
    <rect x="30" y="326" width="940" height="92" rx="14" fill="#0a1626" stroke="#17405f" stroke-width="2"/>
    <text x="500.0" y="354" text-anchor="middle" class="h2">SYSTEM COMMUNICATION</text>
    <text x="70" y="382" class="row"><tspan class="rowb">Bare Metal to Yocto:</tspan>  CAN Bus (sensor data) + UART (fingerprint events)</text>
    <text x="70" y="406" class="row"><tspan class="rowb">Yocto and Android:</tspan>  vsomeip over Ethernet (event-driven bidirectional communication)</text>

    <!-- security -->
    <rect x="30" y="434" width="940" height="42" rx="12" fill="#1a1208" stroke="#b7791f" stroke-width="2"/>
    <text x="500.0" y="460" text-anchor="middle" class="sec">END-TO-END SECURITY   |   SHA Hashing  ·  Secure Authentication  ·  Protected OTA Updates</text>
  </g>
  <rect x="1" y="1" width="998" height="488" rx="17" fill="none" stroke="#17405f" stroke-width="2"/>
</svg>
